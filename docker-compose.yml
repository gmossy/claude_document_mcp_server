services:
  api:
    build:
      context: .
      dockerfile: backend/app/Dockerfile
      # Enable BuildKit for better caching
      args:
        BUILDKIT_INLINE_CACHE: 1
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - DATABASE_URL=sqlite:////data/documents.db
      - STORAGE_DIR=/data/document_storage
      - API_VERSION=0.1.0
      - ALLOW_ORIGINS=["*"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Enable BuildKit for better caching
      args:
        BUILDKIT_INLINE_CACHE: 1
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    restart: unless-stopped

